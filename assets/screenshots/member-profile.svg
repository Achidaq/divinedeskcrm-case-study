  <text x="144" y="386" fill="#65727A" font-family="Inter, Arial, sans-serif" font-size="17">Children: 2</text>
  <text x="144" y="420" fill="#65727A" font-family="Inter, Arial, sans-serif" font-size="17">Address verified</text>
  <text x="144" y="454" fill="#65727A" font-family="Inter, Arial, sans-serif" font-size="17">Preferred contact: SMS</text>

  <rect x="504" y="252" width="360" height="238" rx="12" fill="#FFFFFF" stroke="#D8E1E5"/>
  <text x="536" y="304" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Attendance</text>
  <text x="536" y="364" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">88%</text>
  <text x="536" y="402" fill="#65727A" font-family="Inter, Arial, sans-serif" font-size="17">last 12 Sundays</text>
  <rect x="536" y="432" width="270" height="14" rx="7" fill="#E7ECEF"/>
  <rect x="536" y="432" width="238" height="14" rx="7" fill="#2F7D6D"/>

