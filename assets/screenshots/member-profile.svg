  <rect x="710" y="532" width="546" height="280" rx="12" fill="#172026"/>
  <text x="744" y="584" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Connected Workflows</text>
  <g fill="#BFD3D7" font-family="Inter, Arial, sans-serif" font-size="17">
