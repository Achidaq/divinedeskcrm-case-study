  <text x="928" y="364" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">$3,420</text>
  <text x="928" y="402" fill="#65727A" font-family="Inter, Arial, sans-serif" font-size="17">year to date, receipted</text>
  <text x="928" y="454" fill="#8A620F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Statement ready</text>

  <rect x="112" y="532" width="566" height="280" rx="12" fill="#FFFFFF" stroke="#D8E1E5"/>
  <text x="144" y="584" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Care Timeline</text>
